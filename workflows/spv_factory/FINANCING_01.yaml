task_id: FINANCING_01
name: Approve project financing structure
phase: financing
inputs:
- financial_model
- proposed_financing_structure
- project_budget
dependencies:
- FORMATION_03
decision:
  required: true
  authority: authorized_company_representative
  record: financing_decision_record
execution:
  mode: human
  type: manual
  worker: project_owner
approval:
  required: false
evidence:
- financing_decision_record
completion:
- financing_structure_approved
- decision_record_saved
escalate_if:
- financing_structure_unclear
- funding_gap
- unresolved_debt_terms
- unresolved_equity_terms
applicability:
  type: always
